# Builds the Next.js static export and publishes it to GitHub Pages.
#
# Set repo Settings -> Pages -> Source to "GitHub Actions" (NOT "Deploy from a
# branch"): there is no committed HTML for a branch deploy to serve.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project pages live at /<repo>/, so the export needs that prefix baked in.
      #
      # MOVING TO optimallyapp.com IS A TWO-LINE CHANGE HERE, AND IT MUST HAPPEN
      # AFTER THE DNS RESOLVES, NOT BEFORE. See DEPLOY.md — flipping this early
      # points the whole site at a domain that does not exist yet, and the iOS
      # app's Privacy / Terms / Support links go with it. App Review opens
      # those links.
      #
      #   NEXT_PUBLIC_BASE_PATH: ''                        <- custom domain
      #   NEXT_PUBLIC_SITE_URL:  https://optimallyapp.com
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://nathaniel1232.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
